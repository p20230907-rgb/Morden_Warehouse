<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Assistant</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Basic overrides for font and default link/button styles */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Ensures header links match consistency */
        nav ul li a {
            @apply px-4 py-2 rounded-md transition-colors duration-200;
        }
        nav ul li a:hover {
            @apply bg-blue-700;
        }
        nav ul li a.current {
            @apply bg-blue-700;
        }
        pre {
            white-space: pre-wrap; /* Ensures preformatted text wraps */
            word-wrap: break-word; /* Breaks long words */
        }
        /* Custom styles for chat messages for distinct visual cues */
        .chat-message {
            @apply p-3 mb-2 rounded-lg max-w-[80%]; /* Default base styles */
        }
        .chat-message.user {
            @apply bg-blue-100 text-blue-800 ml-auto text-right;
        }
        .chat-message.bot {
            @apply bg-gray-100 text-gray-800 mr-auto text-left;
        }
        .chat-message.bot.initial {
            @apply bg-green-100 text-green-800 font-semibold;
        }
        .chat-message.error-message {
            @apply bg-red-100 text-red-800 font-semibold;
        }
        /* Safety Info specific styling within chat message */
        .safety-info-label {
            @apply text-blue-700 font-bold;
        }
        .safety-info-content {
            @apply bg-gray-200 p-2 rounded-md text-sm overflow-auto max-h-[150px];
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-gray-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex flex-col md:flex-row items-center justify-between">
            <h1 class="text-3xl font-bold mb-2 md:mb-0">Warehouse Robot Assistant</h1>
            <nav>
                <ul class="flex space-x-4">
                    <li><a href="/" class="text-white hover:text-gray-300">Shelf Map</a></li>
                    <li><a href="/assistance" class="current text-white hover:text-gray-300">General Query Assistant</a></li>
                    <li><a href="/robot_assistance" class="text-white hover:text-gray-300">Robot Control</a></li>
                    <li><a href="/order_management" class="text-white hover:text-gray-300">Order Management</a></li>
                    <li><a href="/deep_thinking_assistant" class="text-white hover:text-gray-300">Deep Thinking</a></li>
                    <li><a href="/performance_dashboard" class="text-white hover:text-gray-300">Performance Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto mt-8 p-6 bg-white rounded-lg shadow-xl flex-grow">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6">How can I help you?</h2>
        
        <div class="flex flex-col md:flex-row md:space-x-6">
            <!-- Left Column for Chat and Quick Questions -->
            <div class="md:w-2/3 flex flex-col space-y-6">
                <!-- Chat Container -->
                <div class="flex-grow bg-gray-50 p-4 rounded-lg shadow-inner overflow-hidden">
                    <div class="chat-messages h-96 overflow-y-auto mb-4 p-2 border border-gray-200 rounded-md bg-white" id="chat-messages">
                        <!-- Chat messages will appear here -->
                    </div>
                    <div class="chat-input flex space-x-2">
                        <input type="text" id="user-query" placeholder="Ask a question about inventory or safety..."
                               class="flex-grow p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="send-query-btn" class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-200">
                            Send
                        </button>
                    </div>
                    <select id="query-mode-select" class="w-full mt-2 p-2 border border-gray-300 rounded-md bg-white text-gray-700">
                        <option value="direct_item_lookup_only">Mode: Direct Item Lookup</option>
                        <option value="llm_only">Mode: LLM Extraction Only</option>
                        <option value="rag_only">Mode: RAG (Vector Search) Only</option>
                        <option value="traditional_search_only">Mode: Traditional Search</option>
                    </select>
                </div>

                <!-- Quick Questions -->
                <div class="predefined-questions bg-gray-50 p-4 rounded-lg shadow">
                    <h3 class="text-lg font-semibold text-gray-700 mb-3">Quick Questions:</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                        <button class="quick-question w-full px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors" data-question="What items are on Shelf B?">What items are on Shelf B?</button>
                        <button class="quick-question w-full px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors" data-question="What's the stock of Apple iPhone 14?">What's the stock of Apple iPhone 14?</button>
                        <button class="quick-question w-full px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors" data-question="Where is the Dell XPS 13 located?">Where is the Dell XPS 13 located?</button>
                        <button class="quick-question w-full px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors" data-question="Tell me about Shelf C.">Tell me about Shelf C.</button>
                        <button class="quick-question w-full px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors" data-question="What PPE is required for handling chemicals?">What PPE is required for handling chemicals?</button>
                        <button class="quick-question w-full px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors" data-question="What are the rules for emergency exits?">What are the rules for emergency exits?</button>
                        <button class="quick-question w-full px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors" data-question="What is the LOTO procedure?">What is the LOTO procedure?</button>
                        <button class="quick-question w-full px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors" data-question="What is the replacement cycle for safety helmets?">What is the replacement cycle for safety helmets?</button>
                    </div>
                </div>
            </div>

            <!-- Right Column for Specialized Operations -->
            <div class="md:w-1/3 flex flex-col space-y-6 mt-6 md:mt-0">
                <div class="specialized-operations bg-gray-50 p-4 rounded-lg shadow">
                    <h3 class="text-lg font-semibold text-gray-700 mb-3">Specialized Operations:</h3>
                    <div class="flex flex-col space-y-3">
                        <button id="order-management-btn" class="w-full px-4 py-2 bg-orange-600 text-white font-semibold rounded-lg shadow-md hover:bg-orange-700 transition-colors duration-200">
                            Order Management
                        </button>
                        <button id="deep-thinking-btn" class="w-full px-4 py-2 bg-purple-600 text-white font-semibold rounded-lg shadow-md hover:bg-purple-700 transition-colors duration-200">
                            Deep Thinking Analysis
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white p-4 text-center mt-8">
        <div class="container mx-auto">
            <p>&copy; 2025 Warehouse Robot Assistant</p>
        </div>
    </footer>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userQueryInput = document.getElementById('user-query');
        const sendQueryBtn = document.getElementById('send-query-btn');
        const quickQuestionBtns = document.querySelectorAll('.quick-question');
        const queryModeSelect = document.getElementById('query-mode-select');

        // Specialized operation button elements
        const orderManagementBtn = document.getElementById('order-management-btn');
        const deepThinkingBtn = document.getElementById('deep-thinking-btn');

        function appendMessage(sender, message, type = 'text') {
            const messageElement = document.createElement('div');
            messageElement.classList.add('chat-message', sender);
            if (type === 'error') {
                messageElement.classList.add('error-message');
            }
            if (type === 'initial') {
                messageElement.classList.add('initial');
            }
            messageElement.innerHTML = `<p>${message}</p>`;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll to bottom
        }

        async function sendQuery() {
            const query = userQueryInput.value.trim();
            const selectedMode = queryModeSelect.value;
            if (query === '') return;

            appendMessage('user', `(Mode: ${selectedMode}) ${query}`);
            userQueryInput.value = '';

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query, mode: selectedMode })
                });

                const data = await response.json();
                
                if (data.status === 'success') {
                    let displayMessage = data.message;
                    // Add structured data to display message for better clarity
                    if (data.data) {
                        if (data.data.item && data.data.item !== 'N/A') {
                            displayMessage += `<br><strong>Item:</strong> ${data.data.item}`;
                        }
                        if (data.data.shelf && data.data.shelf !== 'N/A') {
                            displayMessage += `<br><strong>Shelf:</strong> ${data.data.shelf} (ID: ${data.data.shelf_id})`;
                        }
                        if (data.data.location && data.data.location.x !== 'N/A') {
                            displayMessage += `<br><strong>Location:</strong> (${data.data.location.x.toFixed(3)}, ${data.data.location.y.toFixed(3)}, ${data.data.location.z.toFixed(3)})`;
                        }
                        if (data.data.stock && data.data.stock !== 'N/A') {
                            displayMessage += `<br><strong>Stock:</strong> ${data.data.stock}`;
                        }
                        // Changed safety_info display logic to handle potential long texts
                        if (data.data.safety_info && data.data.safety_info !== 'N/A' && data.data.safety_info !== displayMessage) {
                            if (typeof data.data.safety_info === 'string' && data.data.safety_info.length > 50) { // If it's a long text
                                displayMessage += `<br><br><strong class="safety-info-label">Safety Info:</strong><pre class="safety-info-content">${data.data.safety_info}</pre>`;
                            } else {
                                displayMessage += `<br><strong class="safety-info-label">Safety Info:</strong> ${data.data.safety_info}`;
                            }
                        }
                    }
                    
                    // Always append performance metrics for live results
                    displayMessage += `<br><br>--- Performance Metrics ---`;
                    displayMessage += `<br><strong>Method:</strong> ${data.method || 'N/A'}`;
                    displayMessage += `<br><strong>Total Time:</strong> ${data.total_processing_time.toFixed(4)}s`;
                    if (data.llm_time_without_rag > 0) {
                        displayMessage += `<br><strong>LLM Extr. Time:</strong> ${data.llm_time_without_rag.toFixed(4)}s`;
                    }
                    if (data.rag_time > 0) {
                        displayMessage += `<br><strong>RAG Search Time:</strong> ${data.rag_time.toFixed(4)}s`;
                    }
                    if (data.llm_rag_synthesis_time > 0) {
                        displayMessage += `<br><strong>RAG LLM Synth. Time:</strong> ${data.llm_rag_synthesis_time.toFixed(4)}s`;
                    }
                    if (data.direct_lookup_time > 0) {
                        displayMessage += `<br><strong>Direct Lookup Time:</strong> ${data.direct_lookup_time.toFixed(4)}s`;
                    }
                    if (data.traditional_search_time > 0) { // Added for traditional search
                        displayMessage += `<br><strong>Traditional Search Time:</strong> ${data.traditional_search_time.toFixed(4)}s`;
                    }
                    
                    appendMessage('bot', displayMessage);
                } else {
                    let errorMessage = data.message || `An error occurred: ${response.status}`;
                    // Append performance metrics even for errors
                    errorMessage += `<br><br>--- Performance Metrics ---`;
                    errorMessage += `<br><strong>Method:</strong> ${data.method || 'N/A'}`;
                    errorMessage += `<br><strong>Total Time:</strong> ${data.total_processing_time.toFixed(4)}s`;
                    errorMessage += `<br><strong>HTTP Status:</strong> ${response.status}`;
                    appendMessage('bot', errorMessage, 'error');
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                appendMessage('bot', `An unexpected client-side error occurred: ${error.message}. Please check console for details.`, 'error');
            }
        }

        sendQueryBtn.addEventListener('click', sendQuery);
        userQueryInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendQuery();
            }
        });

        quickQuestionBtns.forEach(button => {
            button.addEventListener('click', function() {
                userQueryInput.value = this.dataset.question;
                sendQuery();
            });
        });

        // Event listeners for specialized operations buttons
        orderManagementBtn.addEventListener('click', function() {
            appendMessage('bot', '<strong>Order Management:</strong> This feature is under development and will allow for managing orders, tracking shipments, and generating reports.');
        });

        deepThinkingBtn.addEventListener('click', function() {
            userQueryInput.value = 'Which items have stock < 20?';
            queryModeSelect.value = 'auto'; // Ensure auto mode is selected for deep thinking
            sendQuery();
        });

        // Initial welcome message
        appendMessage('bot', 'Hello! I am your Warehouse Robot Assistant. I can help you find items, shelves, and provide safety information from the WAREHOUSE SAFETY MANUAL - 2025 (WHS-SOP).', 'initial');
    </script>
</body>
</html>
